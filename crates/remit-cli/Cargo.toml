[package]
name = "remit-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "remit"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
domain = { path = "../domain" }
file-classification-history = { path = "../file-classification-history" }
humantime = "2"
remit-config = { path = "../remit-config" }
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

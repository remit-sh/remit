[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/remit-config",
    "crates/file-classification-history",
    "crates/file-scope-store",
    "crates/file-standing-guidance",
    "crates/osascript-prompter",
    "crates/swift-prompter",
    "crates/prompt-lock",
    "crates/anthropic-classifier",
    "crates/claude-code-hook",
    "crates/remit-cli",
]

[workspace.package]
edition = "2024"
rust-version = "1.89"
